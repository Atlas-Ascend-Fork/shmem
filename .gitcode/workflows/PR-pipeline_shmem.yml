name: PR-pipeline_shmem

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
      types: [ created ]
      keyword: '^(?:\/)?compile*'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name }}
  MERGE_ID: ${{atomgit.event.pull_request.number}}
  TARGET_BRANCH: ${{atomgit.base_ref}}
  SOURCE_BRANCH: ${{atomgit.head_ref}}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  obs_ut_path: "${{ env.obs_path }}/ut"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
          -
            name: show_output
            run: |
              echo "image: ${{ steps.revise_image.outputs.Compile_Ascend_X86 }}"
        if: "${{ default() }}"
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: CodeCheck
    jobs:
      JOB_codecheck_action:
        name: CodeCheck
        uses: .gitcode/workflows/codecheck_action.yml
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_staticcheck_md_check:
        name: CodeCheck_staticcheck_md_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'md_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
    fail-fast: true
  stage3:
    name: Build_and_UT
    jobs:
      JOB_Build_950:
        name: Compile_950
        # release/v1.3.0 分支不支持 Ascend950，跳过编译（job 直接不启动，不占用 ARM runner）
        if: ${{ env.TARGET_BRANCH != 'release/v1.3.0' }}
        uses: .gitcode/workflows/arm_compile_action.yml
        with:
          task_name: 'Compile_950'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_compile_check:
        name: Compile_check
        uses: .gitcode/workflows/arm_compile_action.yml
        with:
          task_name: 'Compile_check'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_UT_examples:
        name: UT_examples
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_examples'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
      JOB_UT_part1:
        name: UT_part1
        uses: .gitcode/workflows/ut_action.yml
        with:
          task_name: 'UT_part1'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
      JOB_UT_part2:
        name: UT_part2
        uses: .gitcode/workflows/ut_action.yml
        with:
          task_name: 'UT_part2'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
    pre:
    - type: auto
    fail-fast: true

post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
