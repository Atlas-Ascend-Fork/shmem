name: arm_pre_smoke

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image_version:
        required: true
        type: string
    outputs:
      arm_run_url:
        value: ${{jobs.JOB_compile.outputs.primary-url}}
      arm_run_key:
        value: ${{jobs.JOB_compile.outputs.primary-key}}

jobs:
  JOB_pre_smoke:
    name: Test
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.sha }}
          token: ${{secrets.GIT_TOKEN}}
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/common.sh
            ${{ env.obs_path }}/build.sh
            ${{ env.obs_path }}/ut.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: Test
        timeout-minutes: 30
        run: |
          set -ex
          export WORKSPACE=${{ steps.process_checkout.outputs.path }}
          export repo_name=${{env.repo_name}}
          export pr_id=${{ env.MERGE_ID }}
          export task_name=${{ inputs.task_name }}
          bash -x $WORKSPACE/ut.sh
    if: "${{ default() }}"
    runs-on: ['self-hosted','os=ubuntu','arch=arm', 'repo=ascend']
