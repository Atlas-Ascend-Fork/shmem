name: arm_pre_smoke

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image_version:
        required: true
        type: string
    outputs:
      arm_run_url:
        value: ${{jobs.JOB_compile.outputs.primary-url}}
      arm_run_key:
        value: ${{jobs.JOB_compile.outputs.primary-key}}

jobs:
  JOB_pre_smoke:
    name: Test
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true
          token: ${{secrets.GIT_TOKEN}}
      -
        name: oidc_auth
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/common.sh
            ${{ env.obs_path }}/build.sh
            ${{ env.obs_path }}/ut.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: Test
        timeout-minutes: 60
        run: |
          set -ex
          export WORKSPACE=${{ steps.process_checkout.outputs.path }}
          export repo_name=${{env.repo_name}}
          export pr_id=${{ env.MERGE_ID }}
          export task_name=${{ inputs.task_name }}
          chown -R root:root /usr/local/Ascend/cann-9.0.0
          chmod -R go-w /usr/local/Ascend/cann-9.0.0/lib64
          bash -x $WORKSPACE/ut.sh
    if: "${{ default() }}"
    runs-on: ['self-hosted','npu=2','smoke=204']
    container:
      image: swr.cn-north-4.myhuaweicloud.com/hw-ascend/${{ inputs.image_version }}
