name: arm_compile_action

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image_version:
        required: true
        type: string
    outputs:
      arm_run_url:
        value: ${{jobs.JOB_compile.outputs.primary-url}}
      arm_run_key:
        value: ${{jobs.JOB_compile.outputs.primary-key}}

jobs:
  JOB_compile:
    name: compile
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.sha }}
          allow-unsafe-pr-checkout: true
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
            ${{ env.obs_path }}/common.sh
            ${{ env.obs_path }}/build.sh
            ${{ env.obs_path }}/compile_check.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: Compile
        identifier: compile
        uses: build-accelerate
        with:
          command: |
            export WORKSPACE=${{ steps.process_checkout.outputs.path }}
            cd ${{ steps.process_checkout.outputs.path }}
            export task_name=${{ inputs.task_name }}
            export target_branch=${{ env.target_branch }}
            if [ ${task_name} =  "Compile_check" ];then
              cp compile_check.sh ./scripts/compile_check.sh
              BuildAccelerate bash -x ./scripts/compile_check.sh
            else
              BuildAccelerate bash -x build.sh
            fi
          AC_SERVER_IP: ${{ vars.AC_SERVER_IP }}
      - name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          artifact-path: "${{ steps.process_checkout.outputs.path }}/output/*"
          object-prefix: ${{ env.obs_path }}/
    if: "${{ default() }}"
    runs-on: [self-hosted, arch=arm64, spec=xlarge]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/hw-ascend/${{ inputs.image_version }}
