minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|\.(html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  # C++ 代码格式化检查
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx|asc)$
        args:
          - "--style=file"
          - "--verbose"
          - "-i"
        exclude: ^build/|tests/third_party/

  # 拼写检查
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # iput/iget are valid SHMEM strided RMA terms, not misspellings of "input".
        args: [
            "-L",
            "CANN,cann,NNAL,nnal,ASCEND,ascend,EnQue,CopyIn,ArchType,AND,ND,tbe,copyin,alog,CLOS,iput,iget,VAs",
            "--skip",
            "*.py,*.cpp,*.hpp,*.c,*.h,tools/pre-commit/typos.toml",
          ]

  # OAT 合规性检查 (Open Source Audit Tool)
  # exclude .pre-commit-config.yaml: CI (cann precommit.py) rewrites this file
  # without comments before running hooks, so its license header is always
  # stripped in CI and OAT would report NoLicenseHeader false-positively.
  - repo: https://gitcode.com/HiAgent/compliance
    rev: v1.0.5
    hooks:
      - id: oat-check
        pass_filenames: true
        stages: [pre-commit]
        verbose: true
        exclude: ^\.pre-commit-config\.yaml$
